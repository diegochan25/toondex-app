[project]
name = 'toondex-app'
version = '0.1.0'
description = 'Add your description here'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'alembic>=1.19.2',
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    'fastapi>=0.141.1',
    'jinja2>=3.1.6',
    'pydantic-settings>=2.15.0',
    'sqlalchemy>=2.0.52',
    "uvicorn>=0.52.4",
]

[build-system]
requires = ['hatchling>=1.32']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
include = ['manage.py']

[project.scripts]
manage = 'manage:app'

[dependency-groups]
dev = [
    'pytest>=9.1.1',
    'typer>=0.27.2',
]
